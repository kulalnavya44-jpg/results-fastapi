<title>Student Result Portal</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #2563eb 0%, transparent 35%),
            radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
            #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .container {
        width: 100%;
        max-width: 850px;
    }

    /* Main Header */
    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 32px;

        background: linear-gradient(
            135deg,
            #3b82f6,
            #8b5cf6
        );

        border-radius: 20px;

        box-shadow:
            0 15px 35px rgba(59, 130, 246, 0.3);
    }

    h1 {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #94a3b8;
        font-size: 15px;
    }

    /* Search Card */
    .search-box {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        padding: 25px;

        border-radius: 20px;

        display: flex;
        gap: 12px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.25);

        margin-bottom: 25px;
    }

    input {
        flex: 1;

        height: 52px;

        padding: 0 18px;

        border: 1px solid #334155;
        border-radius: 12px;

        outline: none;

        background: #0f172a;
        color: white;

        font-size: 15px;

        transition: 0.25s;
    }

    input::placeholder {
        color: #64748b;
    }

    input:focus {
        border-color: #3b82f6;

        box-shadow:
            0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    button {
        height: 52px;

        padding: 0 25px;

        border: none;
        border-radius: 12px;

        color: white;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        background: linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

        box-shadow:
            0 8px 20px rgba(37, 99, 235, 0.3);

        transition: 0.25s;
    }

    button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 12px 25px rgba(37, 99, 235, 0.4);
    }

    button:active {
        transform: translateY(0);
    }

    /* Result Card */
    .student-card {
        background: rgba(255, 255, 255, 0.97);

        color: #0f172a;

        border-radius: 22px;

        padding: 30px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.35);

        animation: slideUp 0.4s ease;
    }

    .student-header {
        display: flex;
        align-items: center;
        gap: 18px;

        padding-bottom: 25px;
        margin-bottom: 25px;

        border-bottom: 1px solid #e2e8f0;
    }

    .student-avatar {
        width: 60px;
        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 16px;

        color: white;
        font-size: 24px;
        font-weight: 700;

        background: linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
    }

    .student-card h2 {
        font-size: 25px;
        margin-bottom: 5px;
    }

    .student-status {
        color: #16a34a;
        font-size: 13px;
        font-weight: 600;
    }

    .student-info {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 15px;

        margin-bottom: 25px;
    }

    .info-box {
        padding: 16px;

        background: #f8fafc;

        border: 1px solid #e2e8f0;

        border-radius: 14px;
    }

    .info-label {
        color: #64748b;

        font-size: 12px;

        text-transform: uppercase;

        letter-spacing: 0.7px;

        margin-bottom: 5px;
    }

    .info-value {
        font-size: 15px;
        font-weight: 600;
    }

    /* Table */
    .table-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .table-wrapper {
        overflow-x: auto;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f1f5f9;

        color: #475569;

        font-size: 12px;

        text-transform: uppercase;

        letter-spacing: 0.5px;

        text-align: left;
    }

    th,
    td {
        padding: 15px;

        border-bottom: 1px solid #e2e8f0;
    }

    tr:last-child td {
        border-bottom: none;
    }

    tbody tr {
        transition: 0.2s;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    td {
        font-size: 14px;
    }

    td:last-child {
        font-weight: 700;
        color: #2563eb;
    }

    /* Not Found */
    .not-found {
        background: rgba(239, 68, 68, 0.1);

        border: 1px solid rgba(239, 68, 68, 0.3);

        color: #fca5a5;

        padding: 18px;

        border-radius: 14px;

        text-align: center;

        animation: shake 0.3s ease;
    }

    /* Footer */
    .footer {
        text-align: center;

        color: #64748b;

        font-size: 12px;

        margin-top: 25px;
    }

    /* Animations */
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes shake {
        0%,
        100% {
            transform: translateX(0);
        }

        25% {
            transform: translateX(-5px);
        }

        75% {
            transform: translateX(5px);
        }
    }

    /* Mobile */
    @media (max-width: 600px) {

        body {
            padding: 20px 12px;
        }

        h1 {
            font-size: 28px;
        }

        .search-box {
            flex-direction: column;
            padding: 18px;
        }

        button {
            width: 100%;
        }

        .student-card {
            padding: 20px;
        }

        .student-info {
            grid-template-columns: 1fr;
        }

        .student-header {
            align-items: flex-start;
        }
    }
</style>

```
<div class="container">

    <!-- Header -->
    <div class="header">

        <div class="logo">
            🎓
        </div>

        <h1>Student Result Portal</h1>

        <p class="subtitle">
            Securely search and view your academic results
        </p>

    </div>


    <!-- Search -->
    <div class="search-box">

        <input
            type="text"
            id="register_number"
            placeholder="Enter Register Number"
            autocomplete="off"
        >

        <button onclick="searchResult()">
            🔍 Search Result
        </button>

    </div>


    <!-- Result -->
    <div id="result"></div>


    <div class="footer">
        © 2026 Student Result Portal • Academic Management System
    </div>

</div>


<script>

    async function searchResult() {

        let registerNumber =
            document.getElementById(
                "register_number"
            ).value.trim();


        if (!registerNumber) {

            document.getElementById("result").innerHTML =
                '<div class="not-found">⚠️ Please enter a register number.</div>';

            return;
        }


        document.getElementById("result").innerHTML =
            '<div class="not-found" style="color:#cbd5e1; border-color:#334155;">🔄 Searching result...</div>';


        try {

            let response =
                await fetch(
                    "https://results-fastapi-lic0.onrender.com/results"
                );


            if (!response.ok) {
                throw new Error("Server error");
            }


            let students =
                await response.json();


            let student =
                students.find(
                    student =>
                        student.register_number === registerNumber
                );


            if (student) {

                let output = `

                    <div class="student-card">

                        <div class="student-header">

                            <div class="student-avatar">
                                ${student.student_name
                                    .charAt(0)
                                    .toUpperCase()}
                            </div>

                            <div>

                                <h2>
                                    ${student.student_name}
                                </h2>

                                <div class="student-status">
                                    ● Result Available
                                </div>

                            </div>

                        </div>


                        <div class="student-info">

                            <div class="info-box">

                                <div class="info-label">
                                    Register Number
                                </div>

                                <div class="info-value">
                                    ${student.register_number}
                                </div>

                            </div>


                            <div class="info-box">

                                <div class="info-label">
                                    Department
                                </div>

                                <div class="info-value">
                                    ${student.department}
                                </div>

                            </div>

                        </div>


                        <div class="table-title">
                            📚 Academic Performance
                        </div>


                        <div class="table-wrapper">

                            <table>

                                <thead>

                                    <tr>
                                        <th>Subject</th>
                                        <th>Grade</th>
                                    </tr>

                                </thead>

                                <tbody>
                `;


                student.subjects.forEach(subject => {

                    output += `

                        <tr>

                            <td>
                                ${subject.subject_name}
                            </td>

                            <td>
                                ${subject.grade}
                            </td>

                        </tr>

                    `;

                });


                output += `

                                </tbody>

                            </table>

                        </div>

                    </div>

                `;


                document.getElementById("result").innerHTML =
                    output;


            } else {

                document.getElementById("result").innerHTML =

                    '<div class="not-found">❌ Student Not Found. Please check the register number.</div>';

            }


        } catch (error) {

            document.getElementById("result").innerHTML =

                '<div class="not-found">⚠️ Unable to connect to the result server. Please make sure the backend is running.</div>';

            console.error(error);

        }

    }


    // Press Enter to search
    document
        .getElementById("register_number")
        .addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                searchResult();
            }

        });

</script>
